<div id="intro-copy"><p id="eyebrow">IMAGINASI • LAPISAN • GERAKAN</p><h1 id="headline">Idea menjadi<br>gerakan.</h1><p id="malay-line">Setiap lapisan, satu cerita.</p><p id="arabic-line" lang="ar" dir="rtl">كلُّ طبقةٍ تحكي قصةً</p></div>

<audio id="soundtrack" data-start="0" data-duration="10" data-track-index="4" data-volume="0.65" src="audio/score.flac"></audio>
</div>
<script>
/* One finite, seekable composition. No animation ticker, event-triggered state, or media control. */
window.__timelines = window.__timelines || {};
window.__hf = window.__hf || {};
window.__hf.buildReady = window.__hf.buildReady || {};
window.__demoReady = false;
window.__hf.buildReady['motion-demo'] = (async function buildScene(){
  await Promise.all([document.fonts.load('700 65px Demo'),document.fonts.load('400 28px Demo')]);
  await document.fonts.ready;
  await Promise.all([...document.images].map(img=>img.decode()));
  if (!document.fonts.check('700 65px Demo') || !document.fonts.check('28px Demo')) throw Error('Required fonts did not load');
  gsap.registerPlugin(DrawSVGPlugin, MorphSVGPlugin, MotionPathPlugin, SplitText);
  const tl = gsap.timeline({paused:true});
  const split = SplitText.create('#headline',{type:'words',wordsClass:'headline-word'});
  // Whole words/lines preserve Arabic joining. Do not split Arabic into chars.
  gsap.set('.headline-word',{display:'inline-block'});
  gsap.set('#world',{transformOrigin:'80% 60%'});
  gsap.set('.dot',{transformOrigin:'50% 50%'});
  tl.fromTo('#eyebrow',{opacity:0,y:14},{opacity:1,y:0,duration:.65,ease:'power3.out'},.15);
  KMMotion.entranceHoldExit(tl,split.words,{start:.35,enterDuration:.65,holdUntil:6.65,exitDuration:.35,stagger:.13,followThrough:.15});
  tl.fromTo('#malay-line',{opacity:0,y:20},{opacity:1,y:0,duration:.7,ease:'power3.out'},1.05);
  tl.fromTo('#arabic-line',{opacity:0,y:16},{opacity:1,y:0,duration:.7,ease:'power3.out'},1.35);
  tl.fromTo('#world',{opacity:0,y:35,scale:.94},{opacity:1,y:0,scale:1,duration:1.25,ease:'power3.out'},.25);
  tl.fromTo('#board',{y:20},{y:-7,duration:6.1,ease:'sine.inOut'},.5);
  tl.fromTo('#back-layer',{x:0},{x:-14,duration:6.8,ease:'none'},0);
  tl.fromTo('#far-layer',{x:0},{x:-5,duration:7,ease:'none'},0);
  tl.fromTo('#foreground',{x:0},{x:9,duration:6.8,ease:'none'},0);
  tl.fromTo('#draw-curve',{drawSVG:'0% 0%'},{drawSVG:'0% 100%',duration:2.4,ease:'power2.inOut'},2.0);
  tl.fromTo('#route-marker',{opacity:0},{opacity:1,duration:.2},1.95);
  tl.to('#route-marker',{motionPath:{path:'#draw-curve',align:'#draw-curve',alignOrigin:[.5,.5],autoRotate:false},duration:2.4,ease:'power2.inOut'},2.0);
  tl.fromTo('.dot',{scale:0},{scale:1,duration:.4,stagger:.17,ease:'back.out(1.6)'},2.0);
  tl.to('#organic-shape',{morphSVG:'#organic-target',duration:4.2,ease:'sine.inOut'},1.1);
  tl.fromTo('#head',{attr:{transform:'translate(-5 -210) rotate(-3 0 20)'}},{attr:{transform:'translate(-5 -210) rotate(2 0 20)'},duration:2.2,ease:'sine.inOut'},1.6);
  // Bake analytical IK into finite rotations; no callbacks needed during seeks.
  const ikSamples=[];
  for(let i=0;i<=180;i++){
    const t=i/30;
    const p=gsap.parseEase('sine.inOut')(Math.min(1,Math.max(0,(t-1.0)/2.1)));
    const back=gsap.parseEase('sine.inOut')(Math.min(1,Math.max(0,(t-4.25)/1.5)));
    const reach=p*(1-back);
    const target={x:100-52*reach,y:30-112*reach};
    const pose=KMMotion.solveTwoBone({x:0,y:0},target,68,62,1);
    ikSamples.push({t,a:pose.upperDegrees,b:pose.lowerLocalDegrees});
  }
  window.__ikSamples=ikSamples;
  tl.set('#upper-arm',{attr:{transform:`rotate(${ikSamples[0].a})`}},0);
  tl.set('#forearm',{attr:{transform:`translate(68 0) rotate(${ikSamples[0].b})`}},0);
  for(let i=1;i<ikSamples.length;i++){
    const p=ikSamples[i];
    tl.to('#upper-arm',{attr:{transform:`rotate(${p.a})`},duration:1/30,ease:'none'},p.t-1/30);
    tl.to('#forearm',{attr:{transform:`translate(68 0) rotate(${p.b})`},duration:1/30,ease:'none'},p.t-1/30);
  }
  tl.to('#world',{scale:1.025,x:-10,duration:3.8,ease:'sine.inOut'},2.5);
  tl.to('#intro-copy',{opacity:0,duration:.4},6.65);
  tl.to('#transition',{x:1280,duration:.65,ease:'power3.inOut'},6.9);
  tl.set('#world',{opacity:0},7.55);
  tl.set('#final-art',{opacity:1},7.55);
  tl.to('#transition',{x:2560,duration:.65,ease:'power3.inOut'},7.6);
  tl.fromTo('#final-copy',{opacity:0,y:28},{opacity:1,y:0,duration:.8,ease:'power3.out'},7.8);
  tl.fromTo('#final-line',{drawSVG:'0% 0%'},{drawSVG:'0% 100%',duration:.9,ease:'power2.out'},8.1);
  // Exactly 10 seconds, with a readable settled final hold.
  tl.to({clock:0},{clock:1,duration:.1},9.9);
  window.__demoManifest={width:1280,height:720,fps:30,duration:10,plugins:['DrawSVGPlugin','MorphSVGPlugin','MotionPathPlugin','SplitText'],arabicUnit:'whole line',rig:'parent-child analytical two-bone IK, baked at 30Hz'};
  // Initialize lazy SVG plugins at both endpoints before the first captured frame.
  tl.seek(10,true).seek(0,true).pause();
  window.__timelines['motion-demo']=tl;
  window.__hfForceTimelineRebind?.();
  window.__demoReady=true;
})().catch(err=>{window.__demoError=String(err);throw err;});

</script>
