name: Publish Motion Atlas Studio package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@akramania'
      - name: Validate package identity and inventory
        run: |
          node -e "const p=require('./package.json'); const c=require('./catalog-summary.json'); if(p.name!=='@akramania/buat-video-motion-grafik' || p.version!=='1.0.0' || c.total_creative_entries!==5042) process.exit(1)"
          npm pack --dry-run
      - name: Publish requested GitHub Packages distribution
        run: npm publish --registry=https://npm.pkg.github.com --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
